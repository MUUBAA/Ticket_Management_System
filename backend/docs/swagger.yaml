definitions:
  models.Attachment:
    properties:
      attachmentId:
        type: integer
      base64Data:
        type: string
      commentId:
        type: integer
      createdAt:
        type: string
      fileName:
        type: string
      fileType:
        type: string
      ticketId:
        type: integer
      url:
        type: string
    type: object
  models.AttachmentCreate:
    properties:
      base64:
        type: string
      fileName:
        type: string
      fileType:
        type: string
      url:
        type: string
    type: object
  models.Comment:
    properties:
      attachments:
        items:
          $ref: '#/definitions/models.Attachment'
        type: array
      commentId:
        type: integer
      createdAt:
        type: string
      createdBy:
        type: integer
      message:
        type: string
      ticketId:
        type: integer
      traceId:
        type: string
      updatedBy:
        type: integer
      userName:
        type: string
    type: object
  models.CommentCreate:
    properties:
      attachments:
        items:
          $ref: '#/definitions/models.AttachmentCreate'
        type: array
      message:
        type: string
      userName:
        type: string
    type: object
  models.Company:
    properties:
      companyId:
        type: integer
      companyName:
        type: string
    type: object
  models.Error:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/models.Error'
      success:
        type: boolean
    type: object
  models.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  models.Pagination:
    properties:
      page:
        type: integer
      pageSize:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  models.ResetPasswordRequest:
    properties:
      newPassword:
        type: string
      token:
        type: string
    type: object
  models.SLAMetrics:
    properties:
      avgFirstResponseHours:
        type: number
      avgResolutionHours:
        type: number
      noDueDateCount:
        type: integer
      overdueCount:
        type: integer
      slaCompliance:
        type: number
    type: object
  models.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  models.Ticket:
    properties:
      assignedTo:
        type: integer
      assignedToName:
        type: string
      companyName:
        type: string
      createdAt:
        type: string
      createdBy:
        type: integer
      createdByEmail:
        type: string
      createdByName:
        type: string
      customerName:
        type: string
      description:
        type: string
      dueDate:
        type: string
      employeeName:
        type: string
      priority:
        type: string
      projectId:
        type: integer
      projectName:
        type: string
      status:
        type: string
      ticketId:
        type: integer
      ticketType:
        type: string
      title:
        type: string
      traceId:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: integer
    type: object
  models.TicketCreate:
    properties:
      assignedTo:
        type: integer
      companyName:
        type: string
      customerName:
        type: string
      description:
        type: string
      dueDate:
        example: "2026-12-31T00:00:00Z"
        type: string
      employeeName:
        type: string
      priority:
        type: string
      projectId:
        type: integer
      projectName:
        type: string
      ticketType:
        type: string
      title:
        type: string
    required:
    - priority
    - ticketType
    - title
    type: object
  models.TicketDetail:
    properties:
      assignedTo:
        type: integer
      attachments:
        items:
          $ref: '#/definitions/models.Attachment'
        type: array
      comments:
        items:
          $ref: '#/definitions/models.Comment'
        type: array
      createdAt:
        type: string
      createdBy:
        type: integer
      customerName:
        type: string
      description:
        type: string
      dueDate:
        type: string
      employeeName:
        type: string
      priority:
        type: string
      projectId:
        type: integer
      projectName:
        type: string
      status:
        type: string
      ticketId:
        type: integer
      ticketType:
        type: string
      title:
        type: string
      traceId:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: integer
    type: object
  models.TicketListResponse:
    properties:
      pagination:
        $ref: '#/definitions/models.Pagination'
      stats:
        $ref: '#/definitions/models.TicketStats'
      tickets:
        items:
          $ref: '#/definitions/models.Ticket'
        type: array
    type: object
  models.TicketStats:
    properties:
      closedCount:
        type: integer
      criticalCount:
        type: integer
      highCount:
        type: integer
      inProgressCount:
        type: integer
      lowCount:
        type: integer
      mediumCount:
        type: integer
      onHoldCount:
        type: integer
      openCount:
        type: integer
      totalItems:
        type: integer
    type: object
  models.TicketUpdate:
    properties:
      assignedTo:
        type: integer
      companyName:
        type: string
      customerName:
        type: string
      description:
        type: string
      dueDate:
        type: string
      employeeName:
        type: string
      priority:
        type: string
      projectId:
        type: integer
      projectName:
        type: string
      status:
        type: string
      ticketType:
        type: string
      title:
        type: string
    type: object
  models.TokenResponse:
    properties:
      expiresIn:
        type: integer
      token:
        type: string
      user:
        $ref: '#/definitions/models.UserResponse'
    type: object
  models.UserListResponse:
    properties:
      pagination:
        $ref: '#/definitions/models.Pagination'
      users:
        items:
          $ref: '#/definitions/models.UserMaster'
        type: array
    type: object
  models.UserLogin:
    properties:
      email:
