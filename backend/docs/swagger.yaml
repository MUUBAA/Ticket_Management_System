  models.UserResponse:
    properties:
      companyName:
        type: string
      designation:
        type: string
      email:
        type: string
      name:
        type: string
      role:
        type: string
      traceId:
        type: string
      userId:
        type: integer
    type: object
  models.UserUpdate:
    properties:
      companyName:
        type: string
      designation:
        type: string
      email:
        type: string
      empId:
        type: string
      name:
        type: string
      reportTo:
        type: integer
    type: object
